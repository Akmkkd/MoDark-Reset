name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # خطوة جديدة: نفحص الملفات الموجودة عشان نشوف الـ gradlew موجود ولا لأ
      - name: List files to debug
        run: ls -la

      # خطوة جديدة: نعطي صلاحيات التشغيل
      - name: Make gradlew executable
        run: chmod +x gradlew

      # خطوة جديدة: نشغل أمر فحص سريع عشان يطلع لنا الخطأ الحقيقي في الشاشة
      - name: Check Gradle tasks
        run: ./gradlew tasks

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoDark-Reset-APK
          path: app/build/outputs/apk/release/app-release.apk
